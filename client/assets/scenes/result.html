<!DOCTYPE html>
<!-- 结算场景：body 半透明叠在定格的对局画面上（MnOverScene.Render 继续画
     DrawAll）。结构须保持「body 直接子元素」的扁平列（嵌套 flex 容器引擎
     不认）。id 由 MnOverScene.OnEnter 回填；按钮 next 走 ConfirmResult
     （赢开下一关、输重开，600ms 冷却内点击无效）。

     外观一律走皮肤包（client/assets/skins/goldminer/skin.css）：按钮的
     渐变/圆角/描边与文字颜色都写在皮肤里，这里只留版式。行内 style 会被
     编译成高优先级的类规则（appCss 叠在皮肤之上），所以颜色一个都不许
     写行内——写了就把皮肤盖掉了。body 上的行内 style 只剩版式（flex 列
     居中 + 间距），遮罩底色交给皮肤的 body.settlement。 -->
<html>
<body class="settlement" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
  <h1 id="headline">过关!</h1>
  <p id="sub">本关 $0 / 目标 $650</p>
  <p id="total" class="total">累计 $0</p>
  <button id="next" class="cta" data-on-click="next">继续 →</button>
  <p class="hint">Esc 退出并存档</p>
</body>
</html>
